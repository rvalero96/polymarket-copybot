<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeBot</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0D0D0D; --surface: #1a1919; --border: rgba(72,72,71,0.15);
      --paper: #00FFA3; --paper-bg: rgba(0,255,163,0.08);
      --live: #F59E0B; --live-bg: rgba(245,158,11,0.08);
      --text: #ffffff; --muted: #ADAAAA;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .ms {
      font-family: 'Material Symbols Outlined'; font-style: normal; font-weight: 300;
      line-height: 1; font-variation-settings: 'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;
      display: inline-block; vertical-align: middle;
    }
    header { text-align: center; margin-bottom: 3rem; }
    .brand {
      font-family: 'Space Grotesk', sans-serif; font-size: 0.65rem; font-weight: 900;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
      opacity: 0.5; margin-bottom: 0.75rem;
    }
    .headline {
      font-family: 'Space Grotesk', sans-serif; font-size: 2.25rem;
      font-weight: 700; letter-spacing: -0.04em; color: var(--text);
    }
    .cards {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
      width: 100%; max-width: 640px; padding: 0 1.5rem;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 1rem;
      padding: 2rem 1.75rem; text-decoration: none; color: var(--text);
      display: flex; flex-direction: column; align-items: flex-start; gap: 1rem;
      cursor: pointer; transition: border-color 0.2s, transform 0.2s, background 0.2s;
      position: relative; overflow: hidden;
    }
    .card-paper:hover { border-color: var(--paper); background: rgba(0,255,163,0.04); transform: translateY(-2px); }
    .card-live:hover  { border-color: var(--live);  background: rgba(245,158,11,0.04); transform: translateY(-2px); }
    .card-icon {
      width: 44px; height: 44px; border-radius: 0.6rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem !important;
    }
    .card-paper .card-icon { background: var(--paper-bg); color: var(--paper); }
    .card-live  .card-icon { background: var(--live-bg);  color: var(--live); }
    .card-title {
      font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem;
      font-weight: 700; letter-spacing: -0.02em;
    }
    .card-paper .card-title { color: var(--paper); }
    .card-live  .card-title { color: var(--live); }
    .card-desc { font-size: 0.78rem; color: var(--muted); line-height: 1.55; }
    .card-badge {
      margin-top: auto; padding: 0.2rem 0.55rem; border-radius: 0.3rem;
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .card-paper .card-badge { background: var(--paper-bg); color: var(--paper); }
    .card-live  .card-badge { background: var(--live-bg);  color: var(--live); }
    footer {
      margin-top: 2.5rem; font-size: 0.58rem; color: var(--muted);
      opacity: 0.3; font-family: monospace;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">TradeBot</div>
    <h1 class="headline">Selecciona un modo</h1>
  </header>

  <div class="cards">
    <a href="/paper" class="card card-paper">
      <div class="card-icon"><span class="ms">science</span></div>
      <div>
        <div class="card-title">Paper</div>
        <div class="card-desc">Simulación con dinero ficticio. Todas las estrategias en modo paper.</div>
      </div>
      <div class="card-badge">Paper mode</div>
    </a>

    <a href="/live" class="card card-live">
      <div class="card-icon"><span class="ms">bolt</span></div>
      <div>
        <div class="card-title">Live</div>
        <div class="card-desc">Operativa real con dinero real. Estrategias conectadas al mercado.</div>
      </div>
      <div class="card-badge">En construcción</div>
    </a>
  </div>

  <footer>v2.0.0 · polymarket-copybot</footer>
</body>
</html>
